[project]
name = "langfit"
version = "0.1.0"
description = "Statistical-physics tools for fitness/energy landscapes of written English"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=8"]
# social-media ingest: parquet reading and fastText language identification
social = ["pyarrow>=15", "fasttext-wheel>=0.9.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["langfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
