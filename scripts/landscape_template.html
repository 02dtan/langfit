function compactWellsTable(wells, isNM) {

    const name = wWord(w.words[0]), approx = wApprox(w.words[0]);
    const share = (w.mass != null) ? `${(100 * w.mass).toFixed(1)}%` : (w.basin_mass != null ? `${(100 * w.basin_mass).toFixed(1)}%` : "—");
    const z = isNM ? `<td class="mono">${fmt(w.E, 1)}</td>` : "";

function trackingTable() {
  const rows = T.tracking.map((t, i) => `<tr><td class="l"><b>W${i + 1}</b> <span class="mono">${t.words.join(", ")}</span></td>
    <td class="mono">${fmt(t.persistence)}${t.essential ? "*" : ""}</td>
    <td class="mono">${t.first_month ?? "—"}</td><td class="mono">${t.stable_month ?? "—"}</td></tr>`).join("");
  return `<table><tr><th class="l">final well</th><th>persistence</th><th>first ≥ 1 bit</th><th>≥ 1 bit ever since</th></tr>${rows}</table>
  <p class="muted">A final well is present in frame t if frame t has a well of persistence ≥ ${D.persist_bits} bit whose minimum lies in the final well's basin.</p>`;
}

  const TB = viewTraj(basisId || "pca");

  <details class="tech"><summary>${uc("details_heading")}</summary>
  <p class="muted">Projection basis: <b>${meta.label}</b>. ${meta.summary || ""} Wells and barriers are features of the projected surface and are recomputed per basis; the string-level minima below are basis-independent.</p>
  <table>
    <tr><td>cumulative tokens N<sub>t</sub></td><td class="mono">${big(T.tokens[f])}</td></tr>
    <tr><td>model entropy S<sub>2</sub>(t)</td><td class="mono">${fmt(T.S2[f], 4)} bits</td></tr>
    <tr><td>strict string-level minima</td><td class="mono">${big(T.n_string_minima[f])}</td></tr>
    <tr><td>share of this model's variance in the fixed plane</td><td class="mono">${pct(TB.plane_share ? TB.plane_share[f] : T.plane_share[f])}</td></tr>
    <tr><td>fit converged · iterations · max gradient (s.e.)</td><td class="mono">${T.converged[f]} · ${T.iterations[f]} · ${fmt(T.max_gradient_in_se[f], 4)}</td></tr>

  <h3>Wells with persistence ≥ ${D.persist_bits} bit in this frame</h3>

  <p><b>σ² selection.</b> ${p.n_folds}-fold cross-validation (the maxent.select_prior procedure, folds run in parallel; seed ${p.seed}) on all ${big(p.tokens)} pooled tokens over σ² ∈ {${p.sigma2.map(s => fmt(s, 3)).join(", ")}}; held-out bits/token ${p.bits.map((b, i) => b.toFixed(6) + " ± " + p.se[i].toFixed(4)).join(", ")}; optimum σ² = ${fmt(p.best_sigma2, 3)}, interior: ${p.interior}. At this N the curve spans ${((Math.max(...p.bits) - Math.min(...p.bits)) * 1e3).toFixed(3)} millibits, ${Math.max(...p.bits) - Math.min(...p.bits) < Math.min(...p.se) ? "less than one standard error, so the prior width barely matters for the pooled fit" : "more than one standard error"}. σ² is the one hyperparameter shared by every frame and is chosen on the full record.</p>

function nmDecode(b64, Typed) {

function nmConfidence2d(mask, zData, xs, ys) {

  // low-confidence DATA cells only (empty cells stay grey); the underlying z

  const z = mask.map((r, ri) => r.map((v, ci) => (v === 0 && zData[ri][ci] !== null && zData[ri][ci] !== undefined) ? 1 : null));

/* Fine-grid confidence wash (smooth mode): nearest-cell lookup of the low-confidence

  const G = mask.length, sub = field.sub, nf = field.nf;

    const v = -0.5 + (r + 0.5) / sub;
    const rr = Math.round(v);
    const row = [];
    for (let c = 0; c < nf; c++) {
      const u = -0.5 + (c + 0.5) / sub;
      const cc = Math.round(u);

      const low = inCell && mask[rr][cc] === 0 && rawRows[rr][cc] !== null && rawRows[rr][cc] !== undefined;

}

function nmWellMask(wells, barrier) {
  // A well is shown only if its basin is confident (well.confident: >50% of the
  // basin's model mass sits in confidently-estimated cells) and its basin mass is
  // at least the user's minimum. Low-confidence / tiny-basin wells (low-ESS /
  // one-sided-mass cells) become spurious deep minima, so they are suppressed.
  const all = wells || [];
  const minMass = 0.001;
  const conf = all.filter(w => w.confident !== false && ((w.basin_mass ?? 0) >= minMass));
  const confCells = new Set(conf.map(w => w.cell));
  let b = null;
  if (barrier && barrier.wells && barrier.wells.every(c => confCells.has(c))) b = barrier;
  return {wells: conf, barrier: b, nMasked: all.length - conf.length};
}

function nmWellsTable(wells, barrier) {
  const cw = capWells(wells, barrier); wells = cw.wells; barrier = cw.barrier;
  if (!wells || !wells.length) return "<p>No well reaches the 1-bit threshold.</p>";
  const capNote = cw.shown < cw.total ? `<p class="muted">Showing ${cw.shown} of ${cw.total} wells (top by persistence; the global minimum and the barrier endpoints are always included).</p>` : "";
  const rows = wells.map((w, i) => `<tr><td class="l"><b>W${i + 1}</b></td><td class="mono">${fmt(w.E)}</td>
     <td class="mono">${fmt(w.persistence)}${w.essential ? "*" : ""}</td><td class="l mono">${w.words.map(e => wellWordLabel(e)).join(", ")}</td></tr>`).join("");
  let b = "";
  if (barrier) {
    const iw = barrier.wells.map(c => wells.findIndex(w => w.cell === c) + 1);
    b = `<p><b>Main barrier</b>: E = ${fmt(barrier.E)} bits, i.e. climb from W${iw[0]} = +${fmt(barrier.above[0])} bits and from W${iw[1]} = +${fmt(barrier.above[1])} bits.</p>`;
  }
  return `<table><tr><th>well</th><th>E<sub>min</sub></th><th>persistence</th><th class="l">most probable strings</th></tr>${rows}</table>
  ${capNote}
  <p class="muted">* global minimum (full height range). z = energy relative to the prior; the empty frame is flat at z = 0. Wells are minima on the move graph (substitution, transposition, insertion, deletion). A trailing * on a word marks an approximate (importance-sampled, L ≥ 6) entry.</p>${b}`;
}

const nmSlider = document.getElementById("nframe");

function nmMonthLabel(f) { return f === 0 ? "empty (prior) model" : `through end of ${NT.months[f]}`; }
function renderNMTraj(f) {

      hovertemplate: (smooth ? "x %{x:.3f} y %{y:.3f}<br>%{text}<extra></extra>" : "z %{z:.2f} bits (energy rel. to prior)" + hoverSuffix + "<extra></extra>")});

      contours: {coloring: "none", showlines: true, start: levels[0], end: levels[levels.length - 1], size: levels[1] - levels[0]},
      line: {width: 0.7, color: "#333"}, showscale: false, hoverinfo: "skip"});

    tr.push(...wellTraces2d(wm.wells, wm.barrier, true, true));

          text: smoothNMText(field, rows, (G === 32) ? NT.cell_words : null, NT_VOCAB, hoverK),
          colorbar: {title: {text: "z bits<br>(energy rel.<br>to prior)", side: "top"}, len: 0.6, thickness: 12},
          hovertemplate: "%{text}<extra></extra>",
          lighting: {ambient: 0.75, diffuse: 0.5, specular: 0.05}, opacity: SURFACE_OPACITY}];
    } else {
      traces = [{type: "surface", contours: NC, x: tileAxis(xs), y: tileAxis(ys), z: tileZ(rows.map(r => r.map(v => nmClip(v, clip))), false), text: tileText(rows, null, "z"),
        customdata: cwg ? tileZ(cwg, false) : null,

        colorbar: {title: {text: "z bits<br>(energy rel.<br>to prior)", side: "top"}, len: 0.6, thickness: 12},

function renderNMTrajPanel(f, wm, G) {
  const pL = NT.per_length_tokens || {};
  const lens = Object.keys(pL).sort((a, b) => a - b);
  const allWells = NT.wells[f] || [];
  const confWells = wm ? wm.wells : allWells;
  const confBarrier = wm ? wm.barrier : (NT.barrier[f] || null);
  const nMasked = wm ? wm.nMasked : 0;
  const levelNote = (G !== 32) ? `<p class="muted"><b>Level ${G}×${G}.</b> The per-frame move-set wells, barrier and cell-word rankings are precomputed at 32×32 only, so they are hidden at other levels.</p>` : "";
  const head = sidebarHead("nm_time", {wells: confWells, barrier: confBarrier, pathInfo: null, res: null, isNM: true, hasBarrier: !!confBarrier, hasPath: false, hasCap: document.getElementById("nclip2").checked});
  document.getElementById("npanel2").innerHTML = `
  ${head}
  <details class="tech"><summary>${uc("details_heading")}</summary>
  <table>
    <tr><td>cumulative tokens N<sub>t</sub></td><td class="mono">${big(NT.tokens[f])}</td></tr>
    <tr><td>grand-canonical entropy S(t)</td><td class="mono">${fmt(NT.S2[f], 4)} bits</td></tr>
    <tr><td>string-level minima (L ≤ 5)</td><td class="mono">${big(NT.n_string_minima[f])}</td></tr>
    <tr><td>confident cells (SE ≤ 0.5 bit)</td><td class="mono">${big(NT.n_confident[f])}</td></tr>
    <tr><td>max finite per-cell SE</td><td class="mono">${(NT.z_se_max[f] === null || NT.z_se_max[f] === undefined) ? "—" : fmt(NT.z_se_max[f], 3) + " bits"}</td></tr>
  </table>
  <p class="muted">Frames are ${NT.period}ly; each frame fits a grand-canonical model over lengths 1..8 (exact MAP L≤5, pseudo-likelihood + exact log Z L=6..8) with per-length Gaussian priors σ²<sub>L</sub> fixed across frames. The empty frame is the prior model (flat at z = 0).</p>
  ${levelNote}
  ${nMasked ? `<p class="muted">${nMasked} of ${allWells.length} wells lie in low-confidence (low-ESS / importance-sampled) cells and are suppressed.</p>` : ""}
  ${nmWellsTable(confWells, confBarrier)}
  <h2>Tokens by length</h2>
  <table><tr><th>L</th><th>tokens in this frame</th></tr>${lens.map(l => `<tr><td class="mono">${l}</td><td class="mono">${big(pL[l][f])}</td></tr>`).join("")}</table>
  </details>`;
  renderPanelMath(document.getElementById("npanel2"));
  const det4 = document.querySelector("#npanel2 details.tech");
  if (det4) det4.addEventListener("toggle", () => { if (det4.open) renderPanelMath(det4); });
}

/* ---- wire up new-model tabs ---- */

  if (!NM) {
    document.getElementById("nplot").innerHTML = `<div class="note">New-model landscape data not yet integrated.</div>`;

/* ---- nearest-word (cursor) hover handlers ---- */
function hoverXY(ev) {
  if (ev.x != null && ev.y != null) return [ev.x, ev.y];
  const p = ev.points && ev.points[0];
  if (p && p.x != null && p.y != null) return [p.x, p.y];
  return null;
}
const nearestBound = {};
function bindHover(id, handler) {
  const el = document.getElementById(id);
  if (!el || typeof el.on !== "function") return;
  if (!nearestBound[id]) { el.on("plotly_unhover", nearestHide); nearestBound[id] = true; }
  if (el.removeAllListeners) el.removeAllListeners("plotly_hover");
  el.on("plotly_hover", handler);
}
function h1(ev) {
  if (document.getElementById("hover1").value !== "near" || !RES1) { nearestHide(); return; }
  const xy = hoverXY(ev);
  if (!xy) { nearestHide(); return; }
  const cell = nearestCell(RES1, xy[0], xy[1]);
  const html = nearestEngineHTML(RES1, RES1_K, cell, xy[0], xy[1]);
  if (html && ev.event) nearestShow(html, ev.event.clientX, ev.event.clientY); else nearestHide();
}
function h2(ev) {
  if (document.getElementById("hover2").value !== "near" || !RES2) { nearestHide(); return; }

  if (!xy) { nearestHide(); return; }
  const cell = nearestCell(RES2, xy[0], xy[1]);

}

const PLOT_FRACS = {plot1: 1.0, plot2: 0.68, nplot: 1.0, nplot2: 0.68};
function refit() {
  for (const [id, frac] of Object.entries(PLOT_FRACS)) {
    const el = document.getElementById(id);
    if (el && el.data && el.offsetParent !== null) Plotly.relayout(id, {height: plotHeight(frac)});
  }
  const ln = document.getElementById("lines");
  if (ln && ln.data && ln.offsetParent !== null) Plotly.relayout("lines", {height: linesHeight(), dragmode: NARROW.matches ? false : "zoom"});
}
let refitTimer = null;
/* Mobile browsers show/hide the URL bar while scrolling, which changes innerHeight; ignore small height-only changes there. */
let lastW = window.innerWidth, lastH = window.innerHeight;
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  if (NARROW.matches && w === lastW && Math.abs(h - lastH) < 150) return;
  lastW = w; lastH = h; refit();
}
window.addEventListener("resize", () => { clearTimeout(refitTimer); refitTimer = setTimeout(onResize, 120); });
window.addEventListener("orientationchange", () => { clearTimeout(refitTimer); refitTimer = setTimeout(() => { lastW = lastH = 0; onResize(); }, 250); });
/* Crossing the 900 px breakpoint (rotating a tablet, resizing a window): redraw so colour bar, camera and heights switch mode. */
NARROW.addEventListener("change", () => {
  const k = [0, 1, 2, 3, 4].find(i => document.getElementById("tab" + i).classList.contains("on"));
  for (const i of [1, 2, 3, 4]) ready[i] = false;
  showTab(k);
});

/* ------------------------------------------------------------------ tab switching */
const N_TABS = 5;
const ready = {0: false, 1: false, 2: false, 3: false, 4: false};
function showTab(k) {
  for (const i of [0, 1, 2, 3, 4]) {
    document.getElementById("tab" + i).classList.toggle("on", i === k);
    document.getElementById("tb" + i).classList.toggle("on", i === k);
  }
  if (k === 1 && !ready[1]) { renderLandscape(); ready[1] = true; }
  else if (k === 1) Plotly.Plots.resize("plot1");
  if (k === 2 && !ready[2]) { renderLines(); setFrame(NF - 1); ready[2] = true; }
  else if (k === 2) { Plotly.Plots.resize("plot2"); Plotly.Plots.resize("lines"); }
  if (k === 3 && !ready[3]) { renderNM(); ready[3] = true; }
  else if (k === 3) Plotly.Plots.resize("nplot");
  if (k === 4 && !ready[4] && NT) { nmSetFrame(NT.months.length - 1); ready[4] = true; }
  else if (k === 4) Plotly.Plots.resize("nplot2");
  refit();
}
